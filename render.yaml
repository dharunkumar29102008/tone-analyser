services:
  - type: web
    name: cerebro-tone-intelligence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "backend.app:create_app()" --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 5000
      - key: GEMINI_API_KEY
        sync: false
